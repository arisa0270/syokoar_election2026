<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>星輝子 AR v4</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR Image Tracking / A-Frame版 -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: transparent;
}

/* MindARが自動生成するカメラ映像 */
video {
  position: fixed !important;
  inset: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  object-fit: cover !important;
}

/* A-Frameの描画キャンバス */
.a-canvas {
  position: fixed !important;
  inset: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
}

    /* MindAR標準UIの上に出す案内 */
    #guide {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;

      width: max-content;
      max-width: calc(100vw - 32px);
      padding: 10px 16px;

      color: #fff;
      background: rgba(0, 0, 0, 0.72);
      border-radius: 999px;

      font-family:
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
      font-size: 14px;
      text-align: center;

      transition:
        opacity 0.3s ease,
        visibility 0.3s ease;
    }

    #guide.hidden {
      opacity: 0;
      visibility: hidden;
    }

    #status {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 10000;

      width: max-content;
      max-width: calc(100vw - 32px);
      padding: 8px 14px;

      color: #fff;
      background: rgba(0, 0, 0, 0.72);
      border-radius: 8px;

      font-family:
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
      font-size: 13px;
      text-align: center;
    }
  </style>

  <script>
  /*
   * 胞子 → Cu召喚演出
   */
  AFRAME.registerComponent("summon-sequence", {
    init: function () {
      this.character = document.querySelector("#cu-character");
      this.guide = document.querySelector("#guide");
      this.status = document.querySelector("#status");

      this.particles = [];
      this.animationStarted = false;
      this.animationStartTime = 0;

      this.createParticles();

      this.el.addEventListener("targetFound", () => {
        console.log("認識成功");

        this.guide.classList.add("hidden");
        this.status.textContent = "召喚中…";

        this.startSequence();
      });

      this.el.addEventListener("targetLost", () => {
        console.log("認識解除");

        this.guide.classList.remove("hidden");
        this.status.textContent = "認識画像を探しています";

        this.resetSequence();
      });
    },

    /*
     * 胞子をプログラムで生成
     */
    createParticles: function () {
      const colors = [
        "#ffffff",
        "#e8d8ff",
        "#d9ffe3",
        "#ffd9f1"
      ];

      for (let i = 0; i < 55; i++) {
        const particle = document.createElement("a-sphere");

        const size = 0.008 + Math.random() * 0.018;

        particle.setAttribute("radius", size);

        particle.setAttribute("material", {
          color: colors[Math.floor(Math.random() * colors.length)],
          emissive: colors[Math.floor(Math.random() * colors.length)],
          emissiveIntensity: 1.3,
          transparent: true,
          opacity: 0,
          shader: "standard"
        });

        particle.object3D.position.set(
          (Math.random() - 0.5) * 1.5,
          (Math.random() - 0.5) * 1.1,
          0.03 + Math.random() * 0.15
        );

        particle.dataset.startX = particle.object3D.position.x;
        particle.dataset.startY = particle.object3D.position.y;
        particle.dataset.startZ = particle.object3D.position.z;

        particle.dataset.speed = 0.7 + Math.random() * 0.8;
        particle.dataset.phase = Math.random() * Math.PI * 2;

        this.el.appendChild(particle);
        this.particles.push(particle);
      }
    },

    /*
     * 召喚演出開始
     */
    startSequence: function () {
      this.animationStarted = true;
      this.animationStartTime = performance.now();

      this.character.setAttribute("visible", true);
      this.character.setAttribute("scale", "0.001 0.001 0.001");
      this.character.setAttribute("material", "opacity", 0);

      this.particles.forEach((particle) => {
        particle.setAttribute("visible", true);
        particle.setAttribute("material", "opacity", 0);
      });
    },

    /*
     * 認識を外した際に初期状態へ戻す
     */
    resetSequence: function () {
      this.animationStarted = false;

      this.character.setAttribute("visible", false);
      this.character.setAttribute("scale", "0.001 0.001 0.001");
      this.character.setAttribute("material", "opacity", 0);

      this.particles.forEach((particle) => {
        particle.setAttribute("visible", false);

        particle.object3D.position.set(
          Number(particle.dataset.startX),
          Number(particle.dataset.startY),
          Number(particle.dataset.startZ)
        );
      });
    },

    /*
     * 毎フレームのアニメーション
     */
    tick: function (time) {
      if (!this.animationStarted) return;

      const elapsed = (time - this.animationStartTime) / 1000;

      /*
       * 0～1.4秒：胞子出現・中央へ集合
       */
      const particleProgress = Math.min(elapsed / 1.4, 1);

      this.particles.forEach((particle, index) => {
        const phase = Number(particle.dataset.phase);
        const speed = Number(particle.dataset.speed);

        const startX = Number(particle.dataset.startX);
        const startY = Number(particle.dataset.startY);
        const startZ = Number(particle.dataset.startZ);

        const targetX = 0;
        const targetY = 0.32;
        const targetZ = 0.04;

        const eased =
          1 - Math.pow(1 - particleProgress, 3);

        particle.object3D.position.x =
          startX +
          (targetX - startX) * eased +
          Math.sin(elapsed * speed * 4 + phase) * 0.015;

        particle.object3D.position.y =
          startY +
          (targetY - startY) * eased +
          Math.cos(elapsed * speed * 3 + phase) * 0.015;

        particle.object3D.position.z =
          startZ +
          (targetZ - startZ) * eased;

        let opacity;

        if (particleProgress < 0.25) {
          opacity = particleProgress / 0.25;
        } else {
          opacity = 1 - Math.max(0, particleProgress - 0.72) / 0.28;
        }

        particle.setAttribute(
          "material",
          "opacity",
          Math.max(0, Math.min(1, opacity))
        );
      });

      /*
       * 1.05秒以降：Cu登場
       */
      if (elapsed >= 1.05) {
        const characterProgress =
          Math.min((elapsed - 1.05) / 0.75, 1);

        const eased =
          1 - Math.pow(1 - characterProgress, 3);

        const scale = 0.72 + eased * 0.28;

        this.character.setAttribute(
          "scale",
          `${scale} ${scale} ${scale}`
        );

        this.character.setAttribute(
          "material",
          "opacity",
          eased
        );

        /*
         * 少し下から上へ現れる
         */
        this.character.object3D.position.y =
          0.26 + eased * 0.12;
      }

      /*
       * 演出完了後
       */
      if (elapsed >= 1.9) {
        this.status.textContent = "星輝子、召喚！";
      }
    }
  });

  window.addEventListener("DOMContentLoaded", () => {
    const scene = document.querySelector("a-scene");
    const status = document.querySelector("#status");

    scene.addEventListener("arReady", () => {
      console.log("MindAR起動成功");
      status.textContent = "認識画像を探しています";
    });

    scene.addEventListener("arError", (event) => {
      console.error("MindAR起動失敗", event);
      status.textContent = "ARの起動に失敗しました";
    });
  });
  </script>
</head>

<body>
  <div id="guide">
    カメラを印刷イラストに向けてください
  </div>

  <div id="status">
    ARを準備しています
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ../assets/targets/target.mind;
      autoStart: true;
      filterMinCF: 0.001;
      filterBeta: 0.01;
      warmupTolerance: 5;
      missTolerance: 5;
    "
    color-space="sRGB"
    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
      alpha: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <!-- 読み込む画像 -->
    <a-assets timeout="15000">
      <img
        id="cu-open"
        src="../assets/characters/cu_open.png"
        crossorigin="anonymous"
      >
    </a-assets>

    <!-- AR用カメラ -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <!-- target.mind内の1枚目を認識 -->
    <a-entity
  mindar-image-target="targetIndex: 0"
  summon-sequence
>
  <!-- Cu立ち絵：最初は非表示 -->
  <a-image
    id="cu-character"
    src="#cu-open"
    width="0.9"
    height="1.35"
    position="0 0.26 0.05"
    scale="0.001 0.001 0.001"
    visible="false"
    material="
      transparent: true;
      opacity: 0;
      alphaTest: 0.01;
      shader: flat;
      depthWrite: false;
    "
  ></a-image>
</a-entity>
  </a-scene>
</body>
</html>
